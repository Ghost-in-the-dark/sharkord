name: Release (Native)

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
          - none
        default: "patch"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and publish native binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build project artifacts
        uses: ./.github/actions/build-sharkord
        with:
          bump: ${{ inputs.bump }}

      - name: Get new version
        id: get_version
        run: echo "version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"

      - name: Identify user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit version bump
        if: ${{ inputs.bump != 'none' }}
        run: |
          git add .
          git commit -m "chore: bump version to ${{ steps.get_version.outputs.version }}"

      - name: Create Git tag
        run: git tag -a "v${{ steps.get_version.outputs.version }}" -m "Release v${{ steps.get_version.outputs.version }}"

      # the tag points at the bump commit, so the release, the tag and the published
      # binaries all describe the same tree
      - name: Push commit and tag
        run: git push --follow-tags

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          name: v${{ steps.get_version.outputs.version }}
          draft: false
          files: |
            apps/server/build/out/sharkord-linux-x64
            apps/server/build/out/sharkord-linux-arm64
            apps/server/build/out/sharkord-windows-x64.exe
            apps/server/build/out/sharkord-macos-arm64
            apps/server/build/out/release.json
          body: |
            Native builds of this fork. The upstream release workflow is not used here
            because it also pushes a Docker image, which needs Docker Hub secrets that a
            fork does not have.

            ## Downloads

            | Platform | Artifact |
            | --- | --- |
            | Linux x64 | `sharkord-linux-x64` |
            | Linux arm64 | `sharkord-linux-arm64` |
            | Windows x64 | `sharkord-windows-x64.exe` |
            | macOS arm64 | `sharkord-macos-arm64` |

            ```bash
            chmod +x sharkord-linux-x64
            ./sharkord-linux-x64
            ```
